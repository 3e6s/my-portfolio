<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#173a78"/>
      <stop offset="100%" stop-color="#0a1f1c"/>
    </linearGradient>
    <linearGradient id="windowBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2454a4"/>
      <stop offset="100%" stop-color="#3f7d52"/>
    </linearGradient>
    <radialGradient id="glow2" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#5b93e6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5b93e6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg2)"/>
  <circle cx="250" cy="140" r="240" fill="url(#glow2)"/>

  <!-- نافذة تطبيق سطح المكتب -->
  <rect x="60" y="70" width="520" height="310" rx="16" fill="#0b1d15" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- شريط عنوان النافذة -->
  <rect x="60" y="70" width="520" height="34" rx="16" fill="url(#windowBar)"/>
  <rect x="60" y="88" width="520" height="16" fill="url(#windowBar)"/>
  <circle cx="82" cy="87" r="5" fill="#ff5f57"/>
  <circle cx="100" cy="87" r="5" fill="#febc2e"/>
  <circle cx="118" cy="87" r="5" fill="#28c840"/>
  <text x="300" y="92" text-anchor="middle" fill="#ffffff" fill-opacity="0.9" font-family="Arial" font-size="13" font-weight="600">أداة إرسال طلبات التوظيف</text>

  <!-- قائمة جهات الاتصال (المستلمين) -->
  <g font-family="Arial">
    <rect x="82" y="118" width="230" height="46" rx="10" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="105" cy="141" r="14" fill="#5b93e6" fill-opacity="0.3"/>
    <text x="105" y="146" text-anchor="middle" fill="#5b93e6" font-size="13" font-weight="700">HR</text>
    <text x="128" y="136" fill="#ffffff" fill-opacity="0.85" font-size="12">مسؤول توظيف - شركة أ</text>
    <text x="128" y="152" fill="#ffffff" fill-opacity="0.4" font-size="10">hr@companyA.com</text>
    <circle cx="292" cy="132" r="4" fill="#3f7d52"/>

    <rect x="82" y="172" width="230" height="46" rx="10" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="105" cy="195" r="14" fill="#3f7d52" fill-opacity="0.3"/>
    <text x="105" y="200" text-anchor="middle" fill="#3f7d52" font-size="13" font-weight="700">HR</text>
    <text x="128" y="190" fill="#ffffff" fill-opacity="0.85" font-size="12">مسؤول توظيف - شركة ب</text>
    <text x="128" y="206" fill="#ffffff" fill-opacity="0.4" font-size="10">jobs@companyB.com</text>
    <circle cx="292" cy="186" r="4" fill="#3f7d52"/>

    <rect x="82" y="226" width="230" height="46" rx="10" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="105" cy="249" r="14" fill="#2454a4" fill-opacity="0.3"/>
    <text x="105" y="254" text-anchor="middle" fill="#5b93e6" font-size="13" font-weight="700">HR</text>
    <text x="128" y="244" fill="#ffffff" fill-opacity="0.85" font-size="12">مسؤول توظيف - شركة ج</text>
    <text x="128" y="260" fill="#ffffff" fill-opacity="0.4" font-size="10">careers@companyC.com</text>
    <circle cx="292" cy="240" r="4" fill="#ffffff" fill-opacity="0.2"/>

    <text x="82" y="296" fill="#ffffff" fill-opacity="0.35" font-size="11">+ 27 مستلم آخر</text>
  </g>

  <!-- زر إرسال جماعي -->
  <rect x="82" y="320" width="230" height="44" rx="10" fill="#2454a4"/>
  <text x="197" y="347" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="700">إرسال جماعي (30)</text>

  <!-- بطاقة بريد صادر متحركة نحو Gmail -->
  <g transform="translate(340,180)">
    <rect x="0" y="0" width="220" height="130" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08"/>
    <path d="M10 20 L110 20 L210 20 L210 110 L10 110 Z" fill="none" stroke="#5b93e6" stroke-width="2" opacity="0.5"/>
    <path d="M10 20 L110 75 L210 20" fill="none" stroke="#5b93e6" stroke-width="2" opacity="0.5"/>
    <text x="110" y="95" text-anchor="middle" fill="#ffffff" fill-opacity="0.6" font-family="Arial" font-size="11">طلب توظيف - فهد الفهيد</text>
  </g>

  <!-- شعار Gmail مبسط -->
  <g transform="translate(636,120)">
    <rect x="0" y="0" width="120" height="90" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.1"/>
    <path d="M14 20 L106 20 L106 70 L14 70 Z" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M14 20 L60 52 L106 20" fill="none" stroke="#ea4335" stroke-width="6" stroke-linejoin="round"/>
    <path d="M14 20 L14 70" stroke="#4285f4" stroke-width="6"/>
    <path d="M106 20 L106 70" stroke="#34a853" stroke-width="6"/>
    <text x="60" y="118" text-anchor="middle" fill="#ffffff" fill-opacity="0.6" font-family="Arial" font-size="12" font-weight="600">Gmail API</text>
  </g>

  <!-- خط اتصال متحرك بين البريد و Gmail -->
  <g stroke="#5b93e6" stroke-width="2" stroke-dasharray="6 6" opacity="0.6">
    <line x1="560" y1="245" x2="636" y2="200"/>
  </g>
  <circle cx="600" cy="222" r="4" fill="#5b93e6"/>

  <!-- عداد الإرسال -->
  <g transform="translate(636,260)">
    <rect x="0" y="0" width="120" height="70" rx="12" fill="#ffffff" fill-opacity="0.05"/>
    <text x="60" y="30" text-anchor="middle" fill="#3f7d52" font-family="Arial" font-size="24" font-weight="800">30</text>
    <text x="60" y="50" text-anchor="middle" fill="#ffffff" fill-opacity="0.5" font-family="Arial" font-size="11">إيميل تم إرساله</text>
  </g>
</svg>
